name: Humanity CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-typecheck:
    name: Code Quality & Type Integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.18.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Verify Workspace & Scan for Secrets
        run: node scripts/verify-setup.js

      - name: Check Formatting
        run: pnpm format

      - name: Typecheck Contracts & Web
        run: pnpm typecheck

      - name: Run Tests
        run: pnpm test

  mobile-analysis:
    name: Flutter Mobile Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        working-directory: apps/mobile
        run: flutter pub get

      - name: Analyze Flutter Code
        working-directory: apps/mobile
        run: flutter analyze
