# Humanity Platform - Supabase CLI Configuration
# Self-hosted / Local Development Stack

project_id = "humanity"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[studio]
enabled = true
port = 54323
api_role = "anon"

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://127.0.0.1:3000/**", "humanity-mobile://auth-callback"]
jwt_expiry = 3600
enable_signup = false # Only invited/provisioned staff accounts allowed

[storage]
enabled = true
file_size_limit = "20MiB"

[analytics]
enabled = false

