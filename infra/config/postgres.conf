# ==============================================================================
# Humanity Platform — Hardened PostgreSQL Configuration (Iraq Deployment)
# Designed for PostgreSQL 15.8 on Sovereign / On-Premise Enterprise Infrastructure
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. NETWORK & CONNECTION SECURITY
# ------------------------------------------------------------------------------
listen_addresses = '0.0.0.0'           # Bound only to isolated internal Docker network
port = 5432
max_connections = 200                  # Sized for Supabase Pooler (PgBouncer) + PostgREST
superuser_reserved_connections = 5
ssl = on
ssl_cert_file = '/etc/ssl/certs/server.crt'
ssl_key_file = '/etc/ssl/private/server.key'
ssl_ciphers = 'HIGH:!aNULL:!MD5:!3DES:!CAMELLIA:!AES128'
ssl_prefer_server_ciphers = on
ssl_min_protocol_version = 'TLSv1.3'
password_encryption = scram-sha-256

# ------------------------------------------------------------------------------
# 2. MEMORY & RESOURCE ALLOCATION (Baseline Sizing: 16 GB RAM / 4 vCPU)
# ------------------------------------------------------------------------------
shared_buffers = 4GB                   # 25% of total system RAM
effective_cache_size = 12GB            # 75% of total system RAM
work_mem = 16MB                        # Per operation memory limit
maintenance_work_mem = 1GB             # For VACUUM, CREATE INDEX
autovacuum_work_mem = 256MB
dynamic_shared_memory_type = posix

# ------------------------------------------------------------------------------
# 3. WRITE-AHEAD LOG (WAL), ARCHIVING & DISASTER RECOVERY
# ------------------------------------------------------------------------------
wal_level = replica                    # Enables Point-In-Time-Recovery (PITR)
archive_mode = on
archive_command = 'test ! -f /var/lib/postgresql/wal_archive/%f && cp %p /var/lib/postgresql/wal_archive/%f'
archive_timeout = 300                  # Forces WAL switch every 5 minutes (RPO <= 5 min)
max_wal_size = 8GB
min_wal_size = 1GB
checkpoint_completion_target = 0.9
checkpoint_timeout = 15min

# ------------------------------------------------------------------------------
# 4. QUERY PLANNER & STORAGE OPTIMIZATIONS (Enterprise NVMe SSD)
# ------------------------------------------------------------------------------
random_page_cost = 1.1                 # Optimized for SSD / NVMe SAN storage
effective_io_concurrency = 200
default_statistics_target = 100

# ------------------------------------------------------------------------------
# 5. AUDIT LOGGING & SECURITY SURVEILLANCE
# ------------------------------------------------------------------------------
logging_collector = on
log_directory = '/var/log/postgresql'
log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'
log_file_mode = 0600
log_truncate_on_rotation = off
log_rotation_age = 1d
log_rotation_size = 100MB
log_min_messages = warning
log_min_error_statement = error
log_min_duration_statement = 250       # Log slow queries exceeding 250ms (SLO threshold)
log_checkpoints = on
log_connections = on
log_disconnections = on
log_lock_waits = on
log_temp_files = 10240                 # Log temp files larger than 10MB
log_line_prefix = '%m [%p] %q%u@%d app=%a client=%h '
log_statement = 'ddl'                  # Always log DDL mutations (schema protection)
log_timezone = 'UTC'

# ------------------------------------------------------------------------------
# 6. TIME SYNCHRONIZATION & LOCALE SETTINGS
# ------------------------------------------------------------------------------
datestyle = 'iso, ymd'
timezone = 'UTC'                       # System clock strictly synchronized to UTC via Chrony
lc_messages = 'en_US.UTF-8'
lc_monetary = 'en_US.UTF-8'
lc_numeric = 'en_US.UTF-8'
lc_time = 'en_US.UTF-8'
default_text_search_config = 'pg_catalog.simple'

# ------------------------------------------------------------------------------
# 7. LOCK & TIMEOUT DEFENSES (Denial of Service Mitigation)
# ------------------------------------------------------------------------------
statement_timeout = 30000              # Abort queries exceeding 30s
lock_timeout = 10000                   # Abort lock acquisitions exceeding 10s
idle_in_transaction_session_timeout = 60000 # Terminate hung transactions after 60s

