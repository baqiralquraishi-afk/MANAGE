# ==============================================================================
# Humanity Platform — PostgreSQL Client Authentication (pg_hba.conf)
# STRICT SECURITY NOTICE:
# - All plaintext / trust authentications are strictly disabled.
# - Password authentication requires scram-sha-256.
# - External connections require client/server SSL.
# ==============================================================================

# TYPE  DATABASE        USER            ADDRESS                 METHOD

# "local" is for Unix domain socket connections only
local   all             postgres                                peer
local   all             all                                     scram-sha-256

# Internal Docker Subnet Only (e.g. 172.28.0.0/16 or internal service alias)
# NEVER expose database port 5432 to public internet or 0.0.0.0/0
hostssl all             postgres        127.0.0.1/32            scram-sha-256
hostssl all             postgres        ::1/128                 scram-sha-256

# Supabase internal services (GoTrue, PostgREST, Storage) connecting via private Docker network
hostssl all             authenticator   172.28.0.0/16           scram-sha-256
hostssl all             supabase_admin  172.28.0.0/16           scram-sha-256
hostssl all             supabase_auth_admin 172.28.0.0/16       scram-sha-256
hostssl all             supabase_storage_admin 172.28.0.0/16    scram-sha-256

# Replication connections (for warm/cold replica streaming)
hostssl replication     replicator      172.28.0.0/16           scram-sha-256

# Reject all other unapproved connections
host    all             all             all                     reject

