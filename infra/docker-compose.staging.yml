# ==============================================================================
# Humanity Platform — Self-Hosted Staging Stack (Docker Compose)
# Architecture: Next.js Web App + Self-Hosted Supabase + Hardened PostgreSQL + MinIO
# STRICT SECURITY COMPLIANCE:
# - No database or storage ports (5432, 9000, 9001) are published to the host.
# - TLS termination is strictly enforced at Traefik edge (Port 443 only).
# - Network boundaries: dmz-net, app-net, db-net, storage-net.
# - All secrets are injected dynamically via environment variables / Vault.
# ==============================================================================

version: '3.8'

networks:
  dmz-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.1.0/24
  app-net:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.28.2.0/24
  db-net:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.28.3.0/24
  storage-net:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.28.4.0/24

volumes:
  postgres_data:
    driver: local
  postgres_wal:
    driver: local
  minio_data:
    driver: local
  traefik_certs:
    driver: local

services:
  # ----------------------------------------------------------------------------
  # 1. EDGE REVERSE PROXY & TLS TERMINATION (Traefik v3.2)
  # ----------------------------------------------------------------------------
  traefik:
    image: traefik:v3.2.1
    container_name: humanity-traefik-staging
    restart: unless-stopped
    ports:
      - '80:80' # Redirects to HTTPS
      - '443:443' # Strict TLS 1.3
    networks:
      - dmz-net
      - app-net
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./config/traefik_dynamic.yml:/etc/traefik/dynamic.yml:ro
      - traefik_certs:/etc/ssl/traefik
    command:
      - '--providers.file.filename=/etc/traefik/dynamic.yml'
      - '--entrypoints.web.address=:80'
      - '--entrypoints.web.http.redirections.entryPoint.to=websecure'
      - '--entrypoints.web.http.redirections.entryPoint.scheme=https'
      - '--entrypoints.websecure.address=:443'
      - '--accesslog=true'
      - '--accesslog.format=json'
      - '--log.level=WARN'
    healthcheck:
      test: ['CMD', 'traefik', 'healthcheck', '--ping']
      interval: 10s
      timeout: 3s
      retries: 3

  # ----------------------------------------------------------------------------
  # 2. NEXT.JS WEB ADMIN APPLICATION (apps/web)
  # ----------------------------------------------------------------------------
  web:
    build:
      context: ../
      dockerfile: apps/web/Dockerfile
    image: humanity-web:0.1.0-staging
    container_name: humanity-web-staging
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      - NEXT_PUBLIC_SUPABASE_URL=https://${DOMAIN_NAME:-humanity.staging.internal}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY:?Required}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY:?Required}
    networks:
      - app-net
    expose:
      - '3000'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/api/health']
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      kong:
        condition: service_healthy

  # ----------------------------------------------------------------------------
  # 3. SUPABASE API GATEWAY (Kong v2.8)
  # ----------------------------------------------------------------------------
  kong:
    image: kong:2.8.1-alpine
    container_name: humanity-kong-staging
    restart: unless-stopped
    environment:
      - KONG_DATABASE=off
      - KONG_DECLARATIVE_CONFIG=/var/lib/kong/kong.yml
      - KONG_DNS_ORDER=LAST,A,CNAME
      - KONG_PLUGINS=request-transformer,cors,key-auth,acl,rate-limiting
      - KONG_NGINX_HTTP_CLIENT_BODY_BUFFER_SIZE=10m
    networks:
      - app-net
    expose:
      - '8000'
    healthcheck:
      test: ['CMD', 'kong', 'health']
      interval: 10s
      timeout: 3s
      retries: 3
    depends_on:
      supabase-db:
        condition: service_healthy

  # ----------------------------------------------------------------------------
  # 4. SUPABASE AUTHENTICATION MICROSERVICE (GoTrue v2.158)
  # ----------------------------------------------------------------------------
  supabase-auth:
    image: supabase/gotrue:v2.158.1
    container_name: humanity-auth-staging
    restart: unless-stopped
    environment:
      - GOTRUE_API_HOST=0.0.0.0
      - GOTRUE_API_PORT=9999
      - GOTRUE_DB_DRIVER=postgres
      - GOTRUE_DB_DATABASE_URL=postgres://supabase_auth_admin:${POSTGRES_AUTH_PASSWORD:?Required}@supabase-db:5432/postgres?sslmode=disable
      - GOTRUE_SITE_URL=https://${DOMAIN_NAME:-humanity.staging.internal}
      - GOTRUE_JWT_SECRET=${JWT_SECRET:?Required}
      - GOTRUE_JWT_EXP=3600
      - GOTRUE_PASSWORD_MIN_LENGTH=12
      - GOTRUE_RATE_LIMIT_HEADER_KEY=X-Real-IP
      - GOTRUE_SECURITY_UPDATE_PASSWORD_REQUIRE_REAUTHENTICATION=true
    networks:
      - app-net
      - db-net
    expose:
      - '9999'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:9999/health']
      interval: 10s
      timeout: 3s
      retries: 3
    depends_on:
      supabase-db:
        condition: service_healthy

  # ----------------------------------------------------------------------------
  # 5. POSTGREST REST API (PostgREST v12.2)
  # ----------------------------------------------------------------------------
  supabase-rest:
    image: postgrest/postgrest:v12.2.0
    container_name: humanity-rest-staging
    restart: unless-stopped
    environment:
      - PGRST_DB_URI=postgres://authenticator:${POSTGRES_AUTHENTICATOR_PASSWORD:?Required}@supabase-db:5432/postgres
      - PGRST_DB_SCHEMAS=public
      - PGRST_DB_ANON_ROLE=anon
      - PGRST_JWT_SECRET=${JWT_SECRET:?Required}
      - PGRST_DB_USE_LEGACY_GUCS=false
      - PGRST_SERVER_TIMING_ENABLED=true
    networks:
      - app-net
      - db-net
    expose:
      - '3000'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/live']
      interval: 10s
      timeout: 3s
      retries: 3
    depends_on:
      supabase-db:
        condition: service_healthy

  # ----------------------------------------------------------------------------
  # 6. SUPABASE STORAGE API SERVICE (Storage v1.11)
  # ----------------------------------------------------------------------------
  supabase-storage:
    image: supabase/storage-api:v1.11.1
    container_name: humanity-storage-staging
    restart: unless-stopped
    environment:
      - ANON_KEY=${SUPABASE_ANON_KEY:?Required}
      - SERVICE_KEY=${SUPABASE_SERVICE_ROLE_KEY:?Required}
      - POSTGREST_URL=http://supabase-rest:3000
      - PGRST_JWT_SECRET=${JWT_SECRET:?Required}
      - DATABASE_URL=postgres://supabase_storage_admin:${POSTGRES_STORAGE_PASSWORD:?Required}@supabase-db:5432/postgres
      - STORAGE_BACKEND=s3
      - GLOBAL_S3_BUCKET=humanity-private-documents
      - GLOBAL_S3_ENDPOINT=http://minio:9000
      - GLOBAL_S3_PROTOCOL=http
      - GLOBAL_S3_FORCE_PATH_STYLE=true
      - AWS_ACCESS_KEY_ID=${MINIO_ROOT_USER:?Required}
      - AWS_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD:?Required}
      - FILE_SIZE_LIMIT=10485760 # 10MB
    networks:
      - app-net
      - db-net
      - storage-net
    expose:
      - '5000'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:5000/status']
      interval: 10s
      timeout: 3s
      retries: 3
    depends_on:
      supabase-db:
        condition: service_healthy
      minio:
        condition: service_healthy

  # ----------------------------------------------------------------------------
  # 7. PRIVATE S3-COMPATIBLE OBJECT STORAGE (MinIO)
  # ----------------------------------------------------------------------------
  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    container_name: humanity-minio-staging
    restart: unless-stopped
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:?Required}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:?Required}
      - MINIO_BROWSER=off # Disable web console (mitigates web UI attack surface)
    volumes:
      - minio_data:/data
    networks:
      - storage-net
    expose:
      - '9000'
    command: server /data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 3s
      retries: 3

  # ----------------------------------------------------------------------------
  # 8. POSTGRESQL 15 HARDENED DATABASE ENGINE
  # ----------------------------------------------------------------------------
  supabase-db:
    image: supabase/postgres:15.8.1.085
    container_name: humanity-db-staging
    restart: unless-stopped
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_ROOT_PASSWORD:?Required}
      - POSTGRES_DB=postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - postgres_wal:/var/lib/postgresql/wal_archive
      - ./config/postgres.conf:/etc/postgresql/postgresql.conf:ro
      - ./config/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - ../supabase/migrations:/docker-entrypoint-initdb.d/migrations:ro
      - ../supabase/seed.sql:/docker-entrypoint-initdb.d/seed.sql:ro
    networks:
      - db-net
    expose:
      - '5432' # STRICT: No host port publication
    command: postgres -c config_file=/etc/postgresql/postgresql.conf -c hba_file=/etc/postgresql/pg_hba.conf
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d postgres']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
